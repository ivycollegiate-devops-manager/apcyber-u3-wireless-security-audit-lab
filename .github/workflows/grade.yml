name: Grade Wireless Security Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas --quiet

      - name: Check for graded artefact
        id: artefact
        shell: bash
        run: |
          if [ -f audit_results.csv ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "audit_results.csv found"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No audit_results.csv committed yet - nothing to grade on this push."
            {
              echo "### Wireless Audit - nothing to grade yet"
              echo ""
              echo "Open audit_results.csv, fill in analyst_notes, then commit and push it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate submitted CSV
        if: steps.artefact.outputs.present == 'true'
        shell: bash
        run: |
          python3 << 'PY'
          import os
          import sys
          import pandas as pd

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          def summary(line=""):
              if summary_path:
                  with open(summary_path, "a") as handle:
                      handle.write(line + "\n")

          try:
              df = pd.read_csv("audit_results.csv")
          except Exception as exc:
              print(f"::error::Could not read audit_results.csv: {exc}")
              sys.exit(1)

          required = [
              "check_id", "check_name", "bssid", "ssid", "encryption",
              "channel", "signal_dbm", "vendor_oui", "vendor_name",
              "is_hidden", "client_count", "notes", "default_severity", "analyst_notes",
          ]
          missing = [column for column in required if column not in df.columns]
          if missing:
              print(f"::error::Missing required columns: {missing}")
              sys.exit(1)
          print(f"All {len(required)} required columns present")
          print(f"{len(df)} finding rows submitted")

          # A NaN cell is not a note. Strip whitespace so " " does not pass either.
          notes = df["analyst_notes"].fillna("").astype(str).str.strip()
          blank_rows = (df.index[notes == ""] + 2).tolist()  # +2 = CSV line number with header
          if blank_rows:
              shown = blank_rows[:25]
              more = "..." if len(blank_rows) > 25 else ""
              print(f"::error::{len(blank_rows)} finding(s) have empty analyst_notes (CSV rows {shown}{more}).")
              sys.exit(1)
          print(f"{len(df)}/{len(df)} findings have analyst_notes")

          lower = notes.str.lower()
          severity_keywords = ["critical", "high", "medium", "low", "accepted risk"]
          classified = notes.apply(lambda text: any(word in text.lower() for word in severity_keywords))
          if not classified.all():
              rows = (df.index[~classified] + 2).tolist()[:25]
              print(f"::warning::Only {int(classified.sum())}/{len(df)} findings carry a severity word; missing at CSV rows {rows}")

          remediation_keywords = ["remediation", "fix", "rotate", "deploy", "segment", "block", "patch", "upgrade"]
          remediated = lower.apply(lambda text: any(word in text for word in remediation_keywords))
          if int(remediated.sum()) < 3:
              print(f"::warning::Only {int(remediated.sum())} findings appear to have remediation proposals (need 3+)")

          fp_keywords = ["false positive", "false-positive", "not a finding", "not a risk", "authorized", "expected", "legitimate", "ha pair", "failover"]
          has_fp = lower.apply(lambda text: any(word in text for word in fp_keywords))
          fp_rows = (df.index[has_fp] + 2).tolist()
          if not fp_rows:
              print("::warning::No false positive identification found in analyst_notes")

          summary("### Wireless Security Audit - validation")
          summary("")
          summary(f"- **Total findings:** {len(df)}")
          summary(f"- **Findings with analyst notes:** {int((notes != '').sum())}/{len(df)}")
          summary(f"- **Checks triggered:** {df['check_id'].nunique()}")
          summary(f"- **Findings with a severity word:** {int(classified.sum())}/{len(df)}")
          summary(f"- **Findings with remediation language:** {int(remediated.sum())}")
          summary(f"- **False-positive CSV rows:** {fp_rows[:10]}")
          summary("")
          summary("| Engine default severity | Count |")
          summary("|---|---|")
          for severity in ["Critical", "High", "Medium", "Low"]:
              summary(f"| {severity} | {int((df['default_severity'] == severity).sum())} |")
          summary("")
          summary("Automated checks are a floor, not the rubric. The teacher reads the triage itself.")
          print("Structure validation passed")
          PY

      - name: Compare against a fresh run (warning only)
        if: steps.artefact.outputs.present == 'true'
        shell: bash
        run: |
          python3 << 'PY'
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          import pandas as pd

          with tempfile.TemporaryDirectory() as scratch:
              for name in ("wireless_audit.py", "wireless_networks.csv"):
                  shutil.copy2(name, scratch)
              subprocess.run(
                  [sys.executable, "wireless_audit.py"],
                  cwd=scratch, capture_output=True, text=True, check=False,
              )
              fresh_path = os.path.join(scratch, "audit_results.csv")
              if not os.path.exists(fresh_path):
                  print("::warning::Fresh reconciliation run produced no results; comparison skipped")
                  sys.exit(0)

              fresh = pd.read_csv(fresh_path)
              submitted = pd.read_csv("audit_results.csv")

              if len(fresh) != len(submitted):
                  print(f"::warning::Finding count differs: submitted {len(submitted)}, fresh run {len(fresh)}")

              expected_ids = set(fresh["check_id"].dropna().astype(str))
              actual_ids = set(submitted["check_id"].dropna().astype(str))
              missing_ids = sorted(expected_ids - actual_ids)
              extra_ids = sorted(actual_ids - expected_ids)
              if missing_ids:
                  print(f"::warning::Check IDs missing from your CSV: {missing_ids}")
              if extra_ids:
                  print(f"::warning::Unexpected check IDs in your CSV: {extra_ids}")

              key = ["check_id", "bssid", "ssid"]
              a = submitted[key].fillna("").astype(str).agg("|".join, axis=1)
              b = fresh[key].fillna("").astype(str).agg("|".join, axis=1)
              changed = len(set(a) ^ set(b))
              if changed:
                  print(f"::warning::{changed} finding key(s) differ from a fresh run - review before assuming the submission is complete")

              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path:
                  with open(summary_path, "a") as handle:
                      handle.write("\n### Reconciliation against a fresh run (advisory)\n\n")
                      handle.write(f"- Submitted findings: {len(submitted)}\n")
                      handle.write(f"- Fresh-run findings: {len(fresh)}\n")
                      handle.write(f"- Check IDs emitted by the engine: {len(expected_ids)}\n\n")
          print("Reconciliation complete")
          PY

      - name: Upload results artifact
        if: steps.artefact.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: audit_results.csv
          retention-days: 30
